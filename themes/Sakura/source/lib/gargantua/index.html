<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>紫罗兰花海与巨型黑洞 — 1:1 WebGL 3D 实时电影级渲染</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='%23181524' stroke='%23ffd58e' stroke-width='3'/></svg>" />


    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/examples/jsm/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" crossorigin src="./assets/index-DSpv6cWK.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CvH72uCH.css">
  </head>
  <body>
    <div id="canvas-container"></div>

    <!-- Minimal collapsible cinema HUD -->
    <div id="hud" class="hud">
      <div class="hud-header">
        <div class="hud-title">
          <span class="dot"></span>
          <span>VIOLET HORIZON // GARGANTUA 3D</span>
        </div>
        <button id="btn-toggle-hud" class="hud-icon-btn" title="折叠/展开控制面板 (H)">
          ▾
        </button>
      </div>

      <div id="hud-body" class="hud-body">
        <div class="hud-row btn-group">
          <button id="btn-cam-lock" class="hud-btn active" title="1:1 复刻原图机位">
            1:1 原图机位
          </button>
          <button id="btn-cam-free" class="hud-btn" title="鼠标拖拽自由环绕漫游">
            3D 自由视角
          </button>
          <button id="btn-cam-rotate90" class="hud-btn" title="切换横屏 / 竖屏90°壁纸方向">
            90° 壁纸竖屏
          </button>
        </div>

        <div class="hud-control">
          <label>
            <span>景深强度 (Bokeh DoF)</span>
            <span id="val-dof">0.92</span>
          </label>
          <input id="slider-dof" type="range" min="0" max="1.8" step="0.02" value="0.92" />
        </div>

        <div class="hud-control">
          <label>
            <span>对焦距离 (Focus)</span>
            <span id="val-focus">8.45m</span>
          </label>
          <input id="slider-focus" type="range" min="1.4" max="25.0" step="0.05" value="8.45" />
        </div>

        <div class="hud-control">
          <label>
            <span>辉光强度 (HDR Bloom)</span>
            <span id="val-bloom">2.20</span>
          </label>
          <input id="slider-bloom" type="range" min="0" max="2.2" step="0.02" value="2.2" />
        </div>

        <div class="hud-control">
          <label>
            <span>体积雾浓度 (Volumetric Fog)</span>
            <span id="val-fog">1.44</span>
          </label>
          <input id="slider-fog" type="range" min="0" max="2.0" step="0.02" value="1.44" />
        </div>

        <div class="hud-control">
          <label>
            <span>吸积盘尺寸 (Accretion Scale)</span>
            <span id="val-disk">1.60x</span>
          </label>
          <input id="slider-disk" type="range" min="0.7" max="1.6" step="0.02" value="1.6" />
        </div>

        <div class="hud-control">
          <label>
            <span>光粒转速 (Particle Speed)</span>
            <span id="val-disk-speed">3.00x</span>
          </label>
          <input id="slider-disk-speed" type="range" min="0" max="3.0" step="0.05" value="3.0" />
        </div>

        <div class="hud-control">
          <label>
            <span>黑洞与场景深蓝移 (Deep Blue Shift)</span>
            <span id="val-blue-photons">0%</span>
          </label>
          <input id="slider-blue-photons" type="range" min="0" max="1.0" step="0.01" value="0.0" />
        </div>

        <div class="hud-control">
          <label>
            <span>星空黑度 (Sky Darkness)</span>
            <span id="val-sky-dark">1.72</span>
          </label>
          <input id="slider-sky-dark" type="range" min="0" max="2.0" step="0.02" value="1.72" />
        </div>

        <div class="hud-hint">
          按 <kbd>H</kbd> 隐藏界面享纯净壁纸 · 自由视角下左键旋转 / 滚轮缩放
        </div>
      </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
      <div class="loader-ring"></div>
      <div class="loader-text">正在构建紫罗兰花海与相对论黑洞吸积盘...</div>
    </div>

  </body>
</html>
