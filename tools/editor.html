<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>文章编辑器 · Just路过</title>
<link rel="stylesheet" href="/editor.css" />
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>文章编辑器</div>
  <button id="btn-new" class="ghost">＋ 新建</button>
  <button id="btn-draft">保存草稿</button>
  <button id="btn-preview" class="ghost">预览</button>
  <button id="btn-del" class="ghost">删除</button>
  <button id="btn-publish" class="primary">发布上线</button>
</header>
<main>
  <aside>
    <div class="search"><input id="q" placeholder="搜索标题…" /></div>
    <div class="list" id="list"></div>
  </aside>
  <section class="editor">
    <div class="fields">
      <input id="title" class="title" placeholder="文章标题" />
      <div class="meta">
        <label>日期</label><input id="date" size="18" />
        <label>标签</label><input id="tags" size="24" placeholder="用逗号分隔，如：随笔, 生活" />
        <label>分类</label><input id="cats" size="16" placeholder="可留空" />
      </div>
    </div>
    <div class="pane-wrap">
      <textarea id="body" placeholder="开始写正文…（支持 Markdown）"></textarea>
      <div id="preview"></div>
    </div>
  </section>
</main>
<footer>
  <span class="status" id="status">就绪</span>
  <span id="words">0 字</span>
  <span class="spacer"></span>
  <span id="sync">未保存</span>
</footer>
<div class="modal" id="modal">
  <div class="box">
    <div class="head" id="modal-title">发布</div>
    <div class="body" id="modal-body"></div>
    <div class="foot"><button id="modal-close">关闭</button></div>
  </div>
</div>
<script src="/editor.js"></script>
</body>
</html>
